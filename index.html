<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Water } from 'three/addons/objects/Water.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const { clamp, lerp } = THREE.MathUtils;
const TAU = Math.PI * 2;
const sm = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
let seed = 1337;
const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;

// =====================================================================
//  Procedural noise & textures
// =====================================================================
const fract = x => x - Math.floor(x);
const h2 = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123);
function vnoise(x, y, per = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const m = per ? v => ((v % per) + per) % per : v => v;
  const a = h2(m(ix), m(iy)), b = h2(m(ix + 1), m(iy)), c = h2(m(ix), m(iy + 1)), d = h2(m(ix + 1), m(iy + 1));
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y, oct = 5, per = 0) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, per * f); n += a; a *= 0.5; f *= 2; }
  return s / n;
}
function makeTex(size, fn, { srgb = true, repeat = 1 } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size); const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const px = fn(x / size, y / size); const i = (y * size + x) * 4;
    d[i] = px[0]; d[i + 1] = px[1]; d[i + 2] = px[2]; d[i + 3] = px.length > 3 ? px[3] : 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function drawTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const mixC = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

function skinTex(base, dark, { stripes = 0, scale = 1, belly = 40 } = {}) {
  const S = 256;
  const f = (u, v) => {
    const n = fbm(u * 6 * scale, v * 6 * scale, 5, 6 * scale);
    const st = stripes * Math.pow(0.5 + 0.5 * Math.sin(v * TAU * 7 + n * 9), 3);
    const k = clamp((n - 0.35) * 1.7 + st, 0, 1);
    const bk = Math.pow(Math.max(0, -Math.sin(u * TAU)), 2) * (1 - k);
    const c = mixC(base, dark, k * 0.9);
    return [c[0] + belly * bk, c[1] + belly * bk, c[2] + belly * bk * 0.8, 255];
  };
  const map = makeTex(S, f);
  const bump = makeTex(S, (u, v) => {
    const n = fbm(u * 6 * scale, v * 6 * scale, 5, 6 * scale);
    const cells = 0.5 + 0.5 * Math.sin(u * TAU * 40 * scale) * Math.sin(v * TAU * 40 * scale);
    const g = 128 + 80 * (cells - 0.5) + 70 * (n - 0.5); return [g, g, g, 255];
  }, { srgb: false });
  return { map, bump };
}

const TEX = {};
TEX.raptor = skinTex([156, 118, 66], [52, 34, 18], { stripes: 0.7, scale: 1.2 });
TEX.theri = skinTex([122, 84, 48], [48, 30, 18], { stripes: 0.2, scale: 0.8, belly: 50 });
TEX.rex = skinTex([96, 88, 76], [34, 30, 26], { stripes: 0.25, scale: 0.7, belly: 30 });
TEX.ground = makeTex(512, (u, v) => {
  const n = fbm(u * 8, v * 8, 6, 8); const sp = h2(Math.floor(u * 512), Math.floor(v * 512));
  const c = mixC([108, 84, 56], [142, 128, 112], sm(0.4, 0.66, n)); const m = 0.82 + 0.36 * sp;
  return [c[0] * m, c[1] * m, c[2] * m, 255];
}, { repeat: 40 });
TEX.groundBump = makeTex(512, (u, v) => { const g = 60 + 150 * fbm(u * 8, v * 8, 6, 8); return [g, g, g, 255]; }, { srgb: false, repeat: 40 });
TEX.rock = makeTex(256, (u, v) => { const n = fbm(u * 5, v * 5, 5, 5); const c = mixC([112, 102, 92], [150, 138, 124], n); return [c[0], c[1], c[2], 255]; });
TEX.rockBump = makeTex(256, (u, v) => { const g = 40 + 180 * fbm(u * 5, v * 5, 5, 5); return [g, g, g, 255]; }, { srgb: false });
TEX.bark = makeTex(256, (u, v) => { const n = fbm(u * 10, v * 10, 5, 10); const c = mixC([70, 46, 28], [122, 92, 62], n); return [c[0], c[1], c[2], 255]; });
TEX.bark.repeat.set(1, 0.25);
TEX.barkBump = makeTex(256, (u, v) => { const g = 60 + 160 * fbm(u * 10, v * 10, 5, 10); return [g, g, g, 255]; }, { srgb: false }); TEX.barkBump.repeat.set(1, 0.25);
TEX.waterN = makeTex(256, (u, v) => {
  const e = 1 / 256, h = (x, y) => fbm(x * 6, y * 6, 4, 6);
  const dx = h(u + e, v) - h(u - e, v), dy = h(u, v + e) - h(u, v - e);
  const n = V3(-dx * 20, -dy * 20, 1).normalize();
  return [(n.x * .5 + .5) * 255, (n.y * .5 + .5) * 255, (n.z * .5 + .5) * 255, 255];
}, { srgb: false });

TEX.feather = drawTex(128, 512, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  for (let y = 40; y < h - 10; y += 3) {
    const k = (y - 40) / (h - 50); const len = Math.sin(Math.PI * Math.min(1, k * 1.15)) * 56 + 4;
    const g = 150 + 60 * Math.sin(y * 0.3); c.strokeStyle = `rgba(${185 + 20 * (k - .5)},${g + 10},${120 + 30 * k},${0.75 + 0.25 * k})`; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(w / 2, y); c.lineTo(w / 2 - len, y - 24); c.moveTo(w / 2, y); c.lineTo(w / 2 + len, y - 24); c.stroke();
  }
  c.strokeStyle = '#4a2e1a'; c.lineWidth = 4; c.beginPath(); c.moveTo(w / 2, 0); c.lineTo(w / 2, h - 12); c.stroke();
});
TEX.frond = drawTex(256, 512, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    const y = h - 20 - i * 18; const k = i / 26; const len = (0.25 + 0.75 * Math.sin(Math.PI * Math.min(1, 0.1 + k))) * 110;
    for (const s of [-1, 1]) {
      c.save(); c.translate(w / 2, y); c.rotate(s * -0.55); c.scale(1, 0.32);
      c.fillStyle = `rgb(${50 + 30 * k},${120 + 50 * (1 - k)},${40 + 20 * k})`;
      c.beginPath(); c.ellipse(s * len / 2, 0, len / 2, 14, 0, 0, TAU); c.fill(); c.restore();
    }
  }
  c.strokeStyle = '#5a7a2a'; c.lineWidth = 6; c.beginPath(); c.moveTo(w / 2, h); c.lineTo(w / 2, 10); c.stroke();
});
TEX.cycad = drawTex(128, 512, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const y = h - 10 - i * 12; const k = i / 40; const len = (0.3 + 0.7 * Math.sin(Math.PI * Math.min(1, 0.15 + k))) * 56;
    c.strokeStyle = `rgb(${30 + 20 * k},${80 + 40 * k},${30})`; c.lineWidth = 3.5;
    c.beginPath(); c.moveTo(w / 2, y); c.lineTo(w / 2 - len, y - 22); c.moveTo(w / 2, y); c.lineTo(w / 2 + len, y - 22); c.stroke();
  }
  c.strokeStyle = '#4a4a20'; c.lineWidth = 5; c.beginPath(); c.moveTo(w / 2, h); c.lineTo(w / 2, 6); c.stroke();
});
TEX.pine = drawTex(256, 128, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  for (let x = 8; x < w - 4; x += 2.5) {
    const k = x / w; const len = (1 - k * 0.6) * 34 + 6;
    c.strokeStyle = `rgba(${20 + 30 * h2(x, 1)},${70 + 50 * h2(x, 2)},${30 + 20 * h2(x, 3)},0.95)`; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(x, h / 2); c.lineTo(x + 9, h / 2 - len); c.moveTo(x, h / 2); c.lineTo(x + 9, h / 2 + len); c.stroke();
  }
  c.strokeStyle = '#5a3c22'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w - 6, h / 2); c.stroke();
});
TEX.horsetail = drawTex(128, 512, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  c.strokeStyle = '#6f9a3a'; c.lineWidth = 7; c.beginPath(); c.moveTo(w / 2, h); c.lineTo(w / 2, 10); c.stroke();
  for (let y = h - 60; y > 20; y -= 48) {
    for (let i = 0; i < 14; i++) { const a = -Math.PI * 0.95 + i / 13 * Math.PI * 0.9; const len = 46;
      c.strokeStyle = '#86b24a'; c.lineWidth = 2; c.beginPath(); c.moveTo(w / 2, y); c.lineTo(w / 2 + Math.cos(a) * len, y + Math.sin(a) * len * 0.55 - 10); c.stroke(); }
    c.fillStyle = '#4a4a20'; c.beginPath(); c.ellipse(w / 2, y, 7, 4, 0, 0, TAU); c.fill();
  }
});
TEX.grass = makeTex(16, (u, v) => { const c = mixC([120, 140, 50], [70, 100, 40], v); return [c[0], c[1], c[2], 255]; });
TEX.spark = drawTex(64, 64, (c, w, h) => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,230,200,1)'); g.addColorStop(0.35, 'rgba(255,200,150,0.5)'); g.addColorStop(1, 'rgba(255,180,120,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); });

// =====================================================================
//  Renderer / scene / lights
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8906a, 50, 215);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.2, 500);

const SUN_DIR = V3(45, 27, 90).normalize();
const skyUniforms = { sunDir: { value: SUN_DIR }, time: { value: 0 } };
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vP; uniform vec3 sunDir; uniform float time;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vP); float h = d.y;
      vec3 c = mix(vec3(1.25,0.70,0.36), vec3(1.15,0.90,0.62), smoothstep(-0.02, 0.10, h));
      c = mix(c, vec3(0.58,0.40,0.60), smoothstep(0.08, 0.42, h));
      c = mix(c, vec3(0.16,0.14,0.36), smoothstep(0.42, 1.0, h));
      float sg = pow(max(dot(d, sunDir), 0.0), 5.0);
      c += vec3(1.0,0.55,0.25) * sg * 1.1;
      vec2 uv = d.xz / (h + 0.18);
      float cl = fbm(uv*1.3 + vec2(time*0.012, 0.0));
      cl = smoothstep(0.46, 0.74, cl) * smoothstep(0.0, 0.12, h) * (1.0 - smoothstep(0.45, 0.9, h));
      vec3 cloudCol = mix(vec3(0.95,0.50,0.48), vec3(1.3,1.0,0.75), sg*1.8);
      c = mix(c, cloudCol, cl*0.75);
      gl_FragColor = vec4(c, 1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), skyMat);
scene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
{ const s = new THREE.Scene(); s.add(sky.clone()); scene.environment = pmrem.fromScene(s, 0.02).texture; }

const sun = new THREE.DirectionalLight(0xffb070, 3.4);
sun.position.copy(SUN_DIR).multiplyScalar(220).add(V3(-4, 0, 0));
sun.target.position.set(-4, 0, 0); scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 120, far: 340 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8a76c0, 0.9); fill.position.set(-60, 40, -30); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff8a44, 1.1); rim.position.set(-30, 18, -90); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x9a78b8, 0x5a4530, 0.75));

const std = (o) => { const m = new THREE.MeshStandardMaterial(o); m.envMapIntensity = 0.35; return m; };

// =====================================================================
//  Terrain, river, rocks
// =====================================================================
const SIZE = 240, SEG = 300;
function riverDepth(x, z) { const c = 24 + Math.sin(x * 0.04) * 4; return Math.max(0, 1 - Math.abs(z - c) / 9); }
function groundH(x, z) {
  let h = (fbm(x * 0.02 + 50, z * 0.02 + 50, 4) - 0.5) * 7 + (fbm(x * 0.13, z * 0.13, 3) - 0.5) * 0.7;
  const rd = riverDepth(x, z); h -= rd * rd * 4.6;
  h += Math.max(0, z - 42) * 0.09 + Math.max(0, -z - 48) * 0.14;
  return h;
}
{
  const g = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  const stone = new THREE.Color(0x9a8d80), dirt = new THREE.Color(0x8a6c48), grass = new THREE.Color(0x6f7f3c), mud = new THREE.Color(0x5a4a38);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), h = groundH(x, z); p.setY(i, h);
    const rd = riverDepth(x, z); const n = fbm(x * 0.05, z * 0.05, 3);
    const c = dirt.clone().lerp(grass, clamp(h * 0.25 + 0.35 + (n - 0.5) * 0.8, 0, 1)).lerp(stone, clamp(rd * 1.6 - 0.2, 0, 1)).lerp(mud, clamp(rd * 2 - 1.2, 0, 1));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const ground = new THREE.Mesh(g, std({ map: TEX.ground, bumpMap: TEX.groundBump, bumpScale: 0.5, vertexColors: true, roughness: 0.95 }));
  ground.receiveShadow = true; scene.add(ground);
}
const water = new Water(new THREE.PlaneGeometry(260, 46), {
  textureWidth: 1024, textureHeight: 1024, waterNormals: TEX.waterN, sunDirection: SUN_DIR.clone(),
  sunColor: 0xffb070, waterColor: 0x2c3a28, distortionScale: 2.2, fog: true, alpha: 1,
});
water.rotation.x = -Math.PI / 2; water.position.set(0, -1.45, 24); water.material.uniforms.size.value = 6; scene.add(water);

{
  const geo = new THREE.IcosahedronGeometry(1, 4); const p = geo.attributes.position; const v = V3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = fbm(v.x * 1.4 + 3, v.y * 1.4 + v.z * 1.1, 4); v.multiplyScalar(0.8 + 0.5 * n); p.setXYZ(i, v.x, v.y * 0.75, v.z); }
  geo.computeVertexNormals();
  const rocks = new THREE.InstancedMesh(geo, std({ map: TEX.rock, bumpMap: TEX.rockBump, bumpScale: 0.6, roughness: 0.9 }), 520);
  rocks.castShadow = rocks.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = V3();
  for (let i = 0; i < rocks.count; i++) {
    const x = (rnd() - 0.5) * 220; const near = rnd() < 0.75;
    const z = near ? 9 + rnd() * 9 + Math.sin(x * 0.04) * 4 : (rnd() < 0.5 ? -12 + rnd() * 20 : 34 + rnd() * 12);
    if (Math.hypot(x, z - 2) < 5.5) continue;
    const sc = 0.2 + rnd() * rnd() * 1.9;
    e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e); s.set(sc * (0.8 + rnd() * 0.6), sc * 0.8, sc * (0.8 + rnd() * 0.6));
    m.compose(V3(x, groundH(x, z) + sc * 0.1, z), q, s); rocks.setMatrixAt(i, m);
    rocks.setColorAt(i, new THREE.Color().setHSL(0.08, 0.1 + rnd() * 0.15, 0.55 + rnd() * 0.3));
  }
  scene.add(rocks);
}

// =====================================================================
//  Vegetation (instanced, with wind)
// =====================================================================
const windU = { value: 0 };
function windy(mat, amp = 0.08) {
  mat.onBeforeCompile = (s) => {
    s.uniforms.uTime = windU;
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float wph = uTime*1.4 + instanceMatrix[3].x*0.35 + instanceMatrix[3].z*0.25;
        float wk = uv.y*uv.y*${amp.toFixed(3)};
        transformed.x += (sin(wph) + 0.5*sin(wph*2.3+1.0)) * wk;
        transformed.z += cos(wph*0.8) * wk * 0.5;`);
  };
  return mat;
}
// camera corridor on the river side, the clearing around the carcass and the forest gap stay free of tall plants
const blocked = (x, z) => (z > 4 && z < 21 && x > -36 && x < 34) || (x > -32 && x < -3 && z > -17 && z < 7) || Math.hypot(x, z - 2) < 12;
const inst = (geo, mat, n) => { const m = new THREE.InstancedMesh(geo, mat, n); m.castShadow = true; m.receiveShadow = true; m.count = 0; return m; };
const M4 = new THREE.Matrix4(), Q4 = new THREE.Quaternion(), E4 = new THREE.Euler(), S4 = V3(), P4 = V3();
function push(im, pos, euler, scale, color) {
  if (im.count >= im.instanceMatrix.count) return;
  E4.set(euler[0], euler[1], euler[2], euler[3] || 'XYZ'); Q4.setFromEuler(E4); S4.set(scale[0], scale[1], scale[2]);
  M4.compose(P4.set(pos[0], pos[1], pos[2]), Q4, S4); im.setMatrixAt(im.count, M4);
  if (color) im.setColorAt(im.count, color); im.count++;
}
const bentPlane = (w, h, segs, bend, taper = 0) => {
  const g = new THREE.PlaneGeometry(w, h, 1, segs); g.translate(0, h / 2, 0); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = p.getY(i) / h; p.setZ(i, -k * k * bend); p.setX(i, p.getX(i) * (1 - taper * k)); }

// =====================================================================
//  Skinned "chain" builder: smooth tube along a spline, bones at keys
// =====================================================================
function chain({ keys, mat, radial = 18, tubular = 48, root = 0, parent = null, bend = [0.2, 0.8], uvScale = 1 }) {
  const pts = keys.map(k => V3(...k.p));
  const rad = keys.map(k => Array.isArray(k.r) ? k.r : [k.r, k.r]);
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const N = 400, cum = [0]; let prev = curve.getPoint(0);
  for (let i = 1; i <= N; i++) { const p = curve.getPoint(i / N); cum.push(cum[i - 1] + p.distanceTo(prev)); prev = p; }
  const total = cum[N];
  const keyT = keys.map((k, i) => cum[Math.round(i / (keys.length - 1) * N)] / total);
  const radiusAt = (t) => {
    let j = 0; while (j < keys.length - 2 && t > keyT[j + 1]) j++;
    const u = clamp((t - keyT[j]) / (keyT[j + 1] - keyT[j]), 0, 1), s = u * u * (3 - 2 * u);
    return [rad[j][0] + (rad[j + 1][0] - rad[j][0]) * s, rad[j][1] + (rad[j + 1][1] - rad[j][1]) * s];
  };
  const bKeys = keys.map((k, i) => i).filter(i => keys[i].bone !== false);
  const bT = bKeys.map(i => keyT[i]);
  const pos = [], uv = [], sIdx = [], sWt = [], idx = [];
  const T = V3(), side = V3(), upv = V3(), p = V3(), v = V3();
  curve.getTangentAt(0, T);
  side.crossVectors(Math.abs(T.y) > 0.9 ? V3(0, 0, 1) : V3(0, 1, 0), T).normalize();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    curve.getPointAt(t, p); curve.getTangentAt(t, T);
    side.sub(v.copy(T).multiplyScalar(side.dot(T))).normalize();
    upv.crossVectors(T, side).normalize();
    const [rx, ry] = radiusAt(t);
    let j = 0, s = 0;
    if (bT.length > 1) { while (j < bT.length - 2 && t > bT[j + 1]) j++; const u = clamp((t - bT[j]) / (bT[j + 1] - bT[j]), 0, 1); s = sm(bend[0], bend[1], u); }
    const j1 = Math.min(j + 1, bT.length - 1);
    for (let k = 0; k <= radial; k++) {
      const a = k / radial * TAU;
      v.copy(p).addScaledVector(side, rx * Math.cos(a)).addScaledVector(upv, ry * Math.sin(a));
      pos.push(v.x, v.y, v.z); uv.push(k / radial, t * uvScale);
      sIdx.push(j, j1, 0, 0); sWt.push(1 - s, s, 0, 0);
    }
  }
  for (let i = 0; i < tubular; i++) for (let k = 0; k < radial; k++) {
    const a = i * (radial + 1) + k, b = a + radial + 1;
    idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  const bones = bKeys.map(() => new THREE.Bone());
  const bp = bKeys.map(i => pts[i]);
  bones.forEach((b, i) => {
    b.userData.pos = bp[i].clone();
    if (i === root) { b.position.copy(bp[i]); if (parent) { b.position.sub(parent.userData.pos); parent.add(b); } }
    else if (i > root) { bones[i - 1].add(b); b.position.subVectors(bp[i], bp[i - 1]); }
    else { bones[i + 1].add(b); b.position.subVectors(bp[i], bp[i + 1]); }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(sIdx, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sWt, 4));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mesh = new THREE.SkinnedMesh(geo, mat);
  mesh.castShadow = mesh.receiveShadow = true; mesh.frustumCulled = false;
  return { mesh, bones };
}

    const sh = theri.roar * 0.22; pos.x += (Math.random() - 0.5) * sh; pos.y += (Math.random() - 0.5) * sh; }
  else if (t < 24.6) { shot = 6; const k = sm(22.9, 24.6, t); pos.set(-3 + k * 2, 4.2, 15); lk.set(9 - k * 2, 1.5, 4); fov = 52; }
  else if (t < 30) { shot = 7; theri.g.getWorldPosition(pos); pos.add(tmp.set(5.5, 3.2, 10)); theri.g.getWorldPosition(lk); lk.y += 3.8; lam = 3; fov = 40; }
  else { shot = 8; const k = sm(30, 36, t); const a = 0.7 - k * 1.2, d = 19 + k * 5; pos.set(STAND.x + Math.sin(a) * d, gy(STAND.x, STAND.z) + 4.5 + k * 3, STAND.z + Math.cos(a) * d); lk.copy(STAND).setY(5.6).lerp(tmp.copy(REXPOS).setY(1.5), 0.2); lam = 3; fov = 40;
    const sh = theri.roar * 0.15; pos.x += (Math.random() - 0.5) * sh; pos.y += (Math.random() - 0.5) * sh; }
  if (shot !== cam.shot || lam === 0) { cam.pos.copy(pos); cam.look.copy(lk); cam.shot = shot; }
  else { const k = 1 - Math.exp(-lam * dt); cam.pos.lerp(pos, k); cam.look.lerp(lk, k); }
  // handheld micro-motion
  const n = 0.03; cam.pos.x += Math.sin(t * 1.7) * n; cam.pos.y += Math.sin(t * 2.3 + 1) * n;
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

// =====================================================================
//  Post-processing
// =====================================================================
const rt = new THREE.WebGLRenderTarget(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.9));
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time)*43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5;
      c.rgb *= 1.0 - dot(d,d)*0.85;                       // vignette
      c.rgb = mix(c.rgb, c.rgb*vec3(1.04,0.98,0.92), 0.5); // warm grade
      c.rgb += (hash(vUv) - 0.5) * 0.025;                  // grain
      gl_FragColor = c; }`
});
composer.addPass(grade);

// =====================================================================
//  Loop
// =====================================================================
const hud = document.getElementById('hud');
const clock = new THREE.Clock();
let t0 = 0, last = 0, started = false;
document.getElementById('restart').onclick = () => { t0 = clock.getElapsedTime(); cam.shot = -1; };
window.__seek = (t, hold = false) => { const now = clock.getElapsedTime(); t0 = now - t; cam.shot = -1; window.__hold = hold ? t : null; for (let k = 0; k < 90; k++) { stepActors(t - 1.5 + k / 60, 1 / 60); stepCamera(t - 1.5 + k / 60, 1 / 60); } };

function frame() {
  requestAnimationFrame(frame);
  const now = clock.getElapsedTime(); const dt = Math.min(0.05, now - last); last = now;
  const t = window.__hold ?? ((now - t0) % T_END);
  windU.value = now; skyUniforms.time.value = now; grade.uniforms.time.value = now % 10;
  water.material.uniforms.time.value = now * 0.6;
  { const p = dust.geometry.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i) + dt * 0.12 * (1 + Math.sin(i)); p.setY(i, y > 9 ? 0 : y); p.setX(i, p.getX(i) + dt * 0.2 * Math.sin(now * 0.3 + i)); } p.needsUpdate = true; }
  stepActors(t, dt); stepCamera(t, dt);
  const c = captions.find(([a, b]) => t >= a && t < b);
  hud.textContent = c ? c[2] : hud.textContent; hud.classList.toggle('on', !!c);
  composer.render();
  if (!started) { started = true; const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(() => l.remove(), 900); }
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
